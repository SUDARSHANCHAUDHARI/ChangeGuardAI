# ChangeGuard AI — pull-request analysis workflow (example)
#
# Drop this into .github/workflows/ in your repository. It runs ChangeGuard
# against each pull request, uploads the reports as an artifact, and fails the
# check when the configured risk threshold is exceeded.
#
# ChangeGuard only READS the pull request (metadata + changed files). It does
# not post comments or modify anything on GitHub in this version.
name: ChangeGuard AI

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Least-privilege: read the repo and PR contents only.
permissions:
  contents: read
  pull-requests: read

jobs:
  changeguard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for accurate diffs)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # `changeguard` is not published to npm and the name is unclaimed there,
      # so never `npm install -g changeguard`: that would run a stranger's
      # package with GITHUB_TOKEN in the environment. Build from source at a
      # pinned tag instead, and bump the tag deliberately.
      - name: Checkout ChangeGuard source
        uses: actions/checkout@v7
        with:
          repository: SUDARSHANCHAUDHARI/ChangeGuardAI
          ref: v0.1.5
          path: .changeguard-tool
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: .changeguard-tool/pnpm-lock.yaml

      # AI is disabled by default, so no model server or API key is required.
      - name: Build ChangeGuard
        working-directory: .changeguard-tool
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Run ChangeGuard on the pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node .changeguard-tool/apps/cli/dist/index.js analyze \
            --pr "${{ github.event.pull_request.number }}" \
            --no-ai \
            --format markdown \
            --fail-on high | tee changeguard-report.md

      - name: Upload ChangeGuard reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: changeguard-reports
          path: |
            .changeguard/
            changeguard-report.md
          if-no-files-found: warn
          # .changeguard/ is a dot-directory; upload-artifact skips those by default.
          include-hidden-files: true
